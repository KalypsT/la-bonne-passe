<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>La bonne passe — prototype 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Yellowtail&display=swap" rel="stylesheet">
<style>
:root{--night:#0E2229;--night2:#0B1C22;--plum:#241320;--plum2:#301A2A;--velvet:#5C1530;--neon:#FF4F8B;--neon-soft:#FFD3E2;--brass:#D4A64A;--cream:#F4DCC8;--muted:#B99CA6;--line:rgba(212,166,74,.28);--ok:#8FE0BA}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#0E2229;--night2:#0B1C22;--plum:#241320;--plum2:#301A2A;--velvet:#5C1530;--neon:#FF4F8B;--neon-soft:#FFD3E2;--brass:#D4A64A;--cream:#F4DCC8;--muted:#B99CA6;--line:rgba(212,166,74,.28);--ok:#8FE0BA}}
:root[data-theme="dark"]{--night:#0E2229;--night2:#0B1C22;--plum:#241320;--plum2:#301A2A;--velvet:#5C1530;--neon:#FF4F8B;--neon-soft:#FFD3E2;--brass:#D4A64A;--cream:#F4DCC8;--muted:#B99CA6;--line:rgba(212,166,74,.28);--ok:#8FE0BA}
:root{box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
body{height:100%;margin:0;background:var(--night);color:var(--cream);font-family:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.script{font-family:"Yellowtail","Brush Script MT",cursive;font-weight:400}
#app{height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* top bar */
.top{flex:none;height:40px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--night2);border-bottom:1px solid var(--line);white-space:nowrap}
.top .brand{font-size:20px;color:var(--neon-soft);text-shadow:0 0 10px rgba(255,79,139,.6);overflow:hidden;text-overflow:ellipsis;max-width:28%}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid #5FBF95;color:var(--ok)}
.pill.closed{border-color:var(--muted);color:var(--muted)}
.pill.open{border-color:var(--neon);color:var(--neon-soft)}
.sp{flex:1}
.stat{font-weight:600;font-variant-numeric:tabular-nums}
.money{color:var(--brass);transition:transform .25s;display:inline-block}
.money.neg{color:var(--neon)}
.money.pulse{transform:scale(1.15)}
.clock b{color:var(--neon-soft);font-size:16px;font-variant-numeric:tabular-nums}
.clock span{color:var(--muted);font-size:12px;margin-left:4px}
.speed{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.speed button{border:0;background:none;padding:3px 9px;font-size:12.5px;color:var(--muted)}
.speed button[aria-pressed="true"]{background:var(--velvet);color:var(--cream)}

/* main */
.main{flex:1;min-height:0;display:flex}
.scene-wrap{flex:none;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--night)}
.scene{position:relative;--u:1px}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}
#hits,#actors,#bubbles,#floaters{position:absolute;inset:0}
#actors,#floaters,#bubbles{pointer-events:none}
.bubble{pointer-events:auto}
.hit{position:absolute;border:0;background:transparent;padding:0;border-radius:calc(3*var(--u))}
.hit:active,.hit.sel{background:rgba(255,79,139,.10);outline:1px solid rgba(255,79,139,.5)}
.actor{position:absolute;padding:0;border:0;background:none;transition:left .9s ease-in-out,top .9s ease-in-out,opacity .5s ease}
.actor svg{width:100%;height:100%;display:block;overflow:visible}
.actor.tap{pointer-events:auto;cursor:pointer}
.actor .pat{position:absolute;left:10%;right:10%;top:-9%;height:calc(3*var(--u));border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.actor .pat i{display:block;height:100%;background:var(--brass)}
.actor .pat.low i{background:var(--neon)}
.bubble{position:absolute;transform:translate(-50%,-50%);width:calc(24*var(--u));height:calc(24*var(--u));min-width:26px;min-height:26px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;font-size:calc(12*var(--u));background:conic-gradient(var(--neon) calc(var(--p,1)*360deg),rgba(255,255,255,.18) 0);box-shadow:0 2px 10px rgba(0,0,0,.5);animation:bob 1.6s ease-in-out infinite;z-index:2}
.bubble span{width:84%;height:84%;border-radius:50%;background:#FFF4EE;display:grid;place-items:center;line-height:1;font-size:max(13px,calc(12*var(--u)))}
.bubble.calm{background:conic-gradient(var(--brass) 360deg,transparent 0)}
@keyframes bob{50%{transform:translate(-50%,-62%)}}
.floater{position:absolute;transform:translate(-50%,0);font-weight:600;color:var(--brass);text-shadow:0 1px 6px rgba(0,0,0,.9);font-size:max(12px,calc(11*var(--u)));animation:floatUp 1.8s ease-out forwards;white-space:nowrap}
@keyframes floatUp{from{opacity:0;transform:translate(-50%,6px)}15%{opacity:1}to{opacity:0;transform:translate(-50%,-30px)}}
.neon-off .neon{opacity:.12}
.neon{transition:opacity .4s}
.neon.flick{animation:flicker 7s infinite}
.neon-off .neon.flick{animation:none}
@keyframes flicker{0%,91%,95%,100%{opacity:1}92%{opacity:.35}93%{opacity:.9}94%{opacity:.25}}
.wave{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.cl,.cr{transform-box:fill-box;transition:transform .8s cubic-bezier(.6,.05,.3,1);transform:scaleX(0)}
.cl{transform-origin:left center}.cr{transform-origin:right center}
.cur.closed .cl,.cur.closed .cr{transform:scaleX(1)}
.cur .plaque,.cur .prog,.cur .progbg{opacity:0;transition:opacity .4s .4s}
.cur.closed .plaque{opacity:1}
.cur.svc .prog,.cur.svc .progbg{opacity:1}
.sheetov{transition:opacity .6s}
#dayTint,#moon,.nw,#salonDim,#redWin,#facHalo{transition:opacity 1.2s}
#toasts{position:absolute;left:8px;right:8px;top:6px;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;z-index:5}
.toast{max-width:96%;background:rgba(36,19,32,.95);border:1px solid var(--line);border-left:3px solid var(--neon);border-radius:10px;padding:6px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.4);animation:tin .3s ease}
.toast b{color:var(--neon-soft);font-weight:600}.toast em{color:var(--muted)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* panel */
.panel{flex:1;min-width:0;display:flex;flex-direction:column;background:linear-gradient(var(--plum2),var(--plum) 30%);border-left:1px solid var(--line)}
.tabs{flex:none;display:flex;gap:2px;padding:4px 4px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:56px;border:0;background:none;border-radius:10px 10px 0 0;padding:5px 4px 4px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;position:relative}
.tabs button .ic{font-size:16px;line-height:1.1}
.tabs button[aria-pressed="true"]{background:var(--velvet);color:var(--cream)}
.tabs button.locked{opacity:.4}
.tabs button.dot::after{content:"";position:absolute;right:8px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--neon)}
.pbody{flex:1;overflow-y:auto;padding:10px 12px 14px;-webkit-overflow-scrolling:touch}
.ticker{flex:none;display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:rgba(0,0,0,.2);padding:5px 12px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker time{color:var(--brass);margin-right:6px}
.ticker b{color:var(--cream);font-weight:500}
h2{margin:0 0 6px;font-size:16px;font-weight:600}
h3{margin:12px 0 6px;font-size:13.5px;font-weight:600;color:var(--brass)}
.sub{margin:0 0 8px;color:var(--muted);font-size:12.5px}
.back{border:0;background:none;color:var(--muted);padding:0 0 6px;font-size:12.5px}
.palier{border:1px solid var(--neon);border-radius:12px;padding:8px 10px;background:rgba(255,79,139,.08);margin-bottom:10px}
.palier b{color:var(--neon-soft)}
.palier .st{margin-top:2px}
.rule{padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
.rule b{font-weight:600;font-size:13px}
.rule small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.seg{display:flex;margin-top:5px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:none;padding:5px 3px;font-size:12.5px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--velvet);color:var(--cream);font-weight:500}
.row{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:0;background:rgba(255,255,255,.045);border-radius:12px;padding:7px 9px;margin-bottom:6px}
.pt{width:34px;height:38px;flex:none;border-radius:50% 50% 8px 8px;background:radial-gradient(circle at 50% 40%,#5a2a44,#2a1220);overflow:hidden}
.pt svg{width:100%;height:100%}
.pt.big{width:54px;height:60px}
.pt.cand{background:radial-gradient(circle at 50% 40%,#1f4250,#0c1f26)}
.grow{flex:1;min-width:0}
.nm{font-weight:600}
.nm small{font-weight:400;color:var(--muted);margin-left:6px}
.st{font-size:12px;color:var(--muted)}
.st.warn{color:var(--neon-soft)}
.bars{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:3px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass)}
.bar.bad i{background:var(--neon)}
.team{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.06)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step button{border:0;background:none;width:30px;height:28px;font-size:16px}
.step button:disabled{opacity:.3}
.step span{min-width:20px;text-align:center;font-weight:600}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.big-money{font-size:24px;font-weight:600;color:var(--brass)}
.acts{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.act{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center}
.act small{color:var(--muted);display:block;font-size:11.5px}
.act .cost{color:var(--brass);font-weight:600;white-space:nowrap}
.act:disabled{opacity:.4;cursor:default}
.act.on{border-color:var(--neon);background:rgba(255,79,139,.12)}
.pips{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.pips i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15)}
.pips i.on{background:var(--brass)}
.traits{display:grid;grid-template-columns:auto auto;justify-content:start;gap:2px 10px;font-size:12px;color:var(--muted);margin-top:6px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);margin:2px 4px 0 0}
.tag.hid{border-style:dashed;color:var(--muted)}
.log{list-style:none;margin:0;padding:0;font-size:12.5px}
.log li{padding:4px 0;border-top:1px solid rgba(255,255,255,.05)}
.log time{color:var(--brass);margin-right:8px}
.lock{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center}

/* overlays */
.modal{position:absolute;inset:0;background:rgba(8,16,20,.74);display:flex;align-items:center;justify-content:center;padding:10px;z-index:30;animation:tin .25s}
.modal[hidden]{display:none}
.card{width:100%;max-width:620px;max-height:100%;overflow:auto;background:linear-gradient(160deg,#3a1629,#1f0f1a);border:1px solid var(--brass);border-radius:16px;padding:14px 16px;box-shadow:0 20px 50px rgba(0,0,0,.5),inset 0 0 0 3px rgba(212,166,74,.08)}
.card.narrow{max-width:440px}
.card h2.script{font-size:30px;line-height:1.05;margin:0 0 6px;color:var(--neon-soft);text-shadow:0 0 12px rgba(255,79,139,.6);font-weight:400}
.card p{margin:0 0 10px;font-size:14px;line-height:1.45}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choices{display:flex;flex-direction:column;gap:6px}
.choices button{text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:12px;padding:8px 11px}
.choices button small{display:block;color:var(--muted);font-size:12px}
.choices button.on{border-color:var(--neon);background:rgba(255,79,139,.12)}
.btn{border:1px solid var(--neon);background:var(--neon);color:#2A0A17;border-radius:12px;padding:9px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--cream);border-color:var(--line);font-weight:500}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.josee{display:flex;gap:10px;align-items:flex-start;background:rgba(0,0,0,.25);border-radius:12px;padding:8px 10px;margin:8px 0;font-style:italic;color:var(--neon-soft);font-size:13px}
.josee .pt{background:radial-gradient(circle at 50% 40%,#4a2a5a,#1e1026)}
.josee b{display:block;font-style:normal;color:var(--brass);font-size:11.5px;font-weight:600}

/* screens */
.screen{position:absolute;inset:0;z-index:40;display:flex;background:radial-gradient(ellipse at 30% 30%,#1c3a44,#0a171c 70%);overflow:auto}
.screen[hidden]{display:none}
.title-l{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;text-align:center}
.logo{font-size:clamp(44px,9vw,76px);color:var(--neon-soft);text-shadow:0 0 8px var(--neon),0 0 24px var(--neon),0 0 48px rgba(255,79,139,.5);line-height:1;animation:flicker 7s infinite}
.tagline{color:var(--muted);margin-top:8px;font-size:13px}
.title-r{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:16px 20px 16px 0;max-width:420px}
.slot{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:9px 11px;background:rgba(36,19,32,.7)}
.slot .grow b{display:block}
.slot .st{font-size:12px}
.slot .btn{padding:6px 12px;font-size:13px}
.slot .del{border:0;background:none;color:var(--muted);font-size:12px;padding:4px}
.create{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:18px;padding:14px 18px;align-content:center;max-width:860px;margin:0 auto;width:100%}
.avs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.av{border:1px solid var(--line);border-radius:12px;background:rgba(36,19,32,.7);padding:4px 4px 3px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--muted)}
.av svg{height:min(19vh,90px);width:auto}
.av[aria-pressed="true"]{border-color:var(--neon);background:rgba(255,79,139,.14);color:var(--cream)}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
.field label{font-size:12.5px;color:var(--muted)}
.field input{font:inherit;color:var(--cream);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:8px 10px;user-select:text}
.preview{font-size:26px;color:var(--neon-soft);text-shadow:0 0 10px var(--neon);text-align:center;margin:4px 0 8px;min-height:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tutorial */
#tring{position:absolute;z-index:35;border:2px solid var(--neon);border-radius:12px;box-shadow:0 0 0 9999px rgba(5,10,12,.55),0 0 18px var(--neon);pointer-events:none;transition:all .35s ease}
#tring[hidden],#tcard[hidden]{display:none}
#tcard{position:absolute;z-index:36;width:min(340px,46%);bottom:10px;background:linear-gradient(160deg,#3a1629,#1f0f1a);border:1px solid var(--brass);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#tcard .josee{margin:0 0 6px;background:none;padding:0}
#tcard .btns{margin-top:6px}
#tcard .btn{padding:6px 12px;font-size:13px}

#rotate{display:none;position:fixed;inset:0;z-index:100;background:var(--night);color:var(--cream);flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;gap:12px}
#rotate .ic{font-size:48px;animation:rot 2s ease-in-out infinite}
@keyframes rot{50%{transform:rotate(90deg)}}
@media (orientation: portrait) and (max-width: 760px){#rotate{display:flex}}
@media (prefers-reduced-motion: reduce){.neon.flick,.wave,.bubble,.logo,#rotate .ic{animation:none}.actor{transition:opacity .3s}.cl,.cr{transition-duration:.01s}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="brand script" id="brand">La bonne passe</span>
    <span class="pill">Amsterdam, légal</span>
    <span class="sp"></span>
    <span class="stat money" id="money">3 000 €</span>
    <span class="stat" id="rep">★ 15</span>
    <span class="clock"><b id="clock">17:00</b><span id="day">Lundi, jour 1</span></span>
    <span class="pill closed" id="openPill">Fermé</span>
    <div class="speed" id="speed" role="group" aria-label="Vitesse"></div>
  </header>
  <div class="main" id="main">
    <div class="scene-wrap" id="wrap">
      <div id="toasts" aria-live="polite"></div>
      <div class="scene neon-off" id="scene">
<svg id="bg" viewBox="0 0 600 410" aria-hidden="true">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#081A20"/><stop offset=".75" stop-color="#16323B"/><stop offset="1" stop-color="#1B3A44"/></linearGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123440"/><stop offset="1" stop-color="#06141A"/></linearGradient>
  <radialGradient id="redwin" cx=".5" cy=".55" r=".7"><stop offset="0" stop-color="#FF6B7E"/><stop offset=".55" stop-color="#E0213F"/><stop offset="1" stop-color="#6E0A1E"/></radialGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#FF4F8B" stop-opacity=".5"/><stop offset="1" stop-color="#FF4F8B" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm"><stop offset="0" stop-color="#F6C878" stop-opacity=".55"/><stop offset="1" stop-color="#F6C878" stop-opacity="0"/></radialGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C9D6E2"/><stop offset=".5" stop-color="#6F8497"/><stop offset="1" stop-color="#A9B9C8"/></linearGradient>
  <pattern id="brick" width="12" height="6" patternUnits="userSpaceOnUse"><rect width="12" height="6" fill="#5E2626"/><path d="M0 5.5H12M6 0V2.8M0 2.8H12M0 2.8V5.5M12 2.8V5.5" stroke="#471B1C" stroke-width=".6"/></pattern>
  <pattern id="cobble" width="10" height="6" patternUnits="userSpaceOnUse"><rect width="10" height="6" fill="#2E2220"/><rect x=".6" y=".6" width="8.8" height="4.8" rx="2" fill="#3C2D2A"/></pattern>
  <pattern id="stripes" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#3A1826"/><rect width="4" height="10" fill="#43202F"/></pattern>
  <pattern id="damask" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#5C1530"/><path d="M7 2L10 7L7 12L4 7Z" fill="#6A1B39"/></pattern>

  if(l.pearls)o+=`<path d="M10 14.6Q12 16.4 14 14.6" stroke="#F4EFE6" stroke-width="1" stroke-dasharray=".6 .5" fill="none"/>`;
  o+=`<circle cx="12" cy="8" r="4.6" fill="${s}"/>`;
  if(l.beard)o+=`<path d="M7.6 8.6Q8 13.6 12 13.8Q16 13.6 16.4 8.6Q15 11 12 11Q9 11 7.6 8.6Z" fill="${h}"/>`;
  if(l.moustache)o+=`<path d="M10 10.2Q12 9.2 14 10.2Q12 10.8 10 10.2Z" fill="${l.moustache}"/>`;
  if(l.afro)o+=`<path d="M7.4 7Q8 3.4 12 3.2Q16 3.4 16.6 7Q14.5 5.4 12 5.4Q9.5 5.4 7.4 7Z" fill="${h}"/>`;

  else if(l.bald)o+=`<path d="M7.5 8.5Q7.4 6.6 8.2 6.2M16.5 8.5Q16.6 6.6 15.8 6.2" stroke="${h}" stroke-width="1.2" fill="none"/>`;
  else if(l.kind==="f")o+=`<path d="M7 10Q6.4 2.6 12 2.8Q17.6 2.6 17 10H16.2Q16 6 12 5.6Q8 6 7.8 10Z" fill="${h}"/>`;

}

  const segs=openSegs(),pool=CLIENTS.filter(c=>segs.includes(c.seg)&&!R.queue.some(q=>q.name===c.name));
  if(!pool.length)return;
  const w=pool.map(c=>{let x=1;if(S.offer==="happy"&&c.seg==="touriste")x*=1.6;if(S.offer==="calme"&&c.seg==="habitue")x*=1.5;if(c.seg==="habitue")x*=.6+S.rep/60;return x});
  let tot=w.reduce((a,b)=>a+b,0),r=Math.random()*tot,tpl=pool[0];for(let i=0;i<pool.length;i++){if((r-=w[i])<=0){tpl=pool[i];break}}
  const c=Object.assign({},tpl,{id:++R.clientId,pat:55,patMax:55});
  c.el=mkActor(c.look,"");c.el.insertAdjacentHTML("afterbegin",`<div class="pat"><i></i></div>`);

}

}
const roomFree=r=>r.open&&!r.closed&&!r.reno&&r.p>=15&&!R.busy[r.id];
const staffFree=s=>s.works&&!s.resting&&!s.busy&&!s.anim&&s.night<rule("maxRdv").n;
function dispatch(){
  let guard=4;
  while(R.queue.length&&guard--){
    const c=R.queue[0];
    const rooms=S.rooms.filter(roomFree);if(!rooms.length)return;
    const staff=S.staff.filter(staffFree);if(!staff.length)return;
    const room=rooms.sort((a,b)=>(b.p+b.etat)-(a.p+a.etat))[0];
    const s=staff.sort((a,b)=>(b.tr[c.want]-b.fatigue/35)-(a.tr[c.want]-a.fatigue/35))[0];
    startService(c,s,room);
  }
}
function startService(c,s,room){

}
function finish(roomId){
  const b=R.busy[roomId];delete R.busy[roomId];const room=roomBy(roomId),rd=RD(roomId);const c=b.client,s=staffBy(b.staffId);
  let q=s.tr[c.want]/5*.45+room.p/100*.2+room.etat/100*.15+(S.linge>0?.12:0)+OFFERS[S.offer].q-(s.fatigue>75?.15:0)+(rd.premium?.06:0);
  q=clamp(q,0,1);
  const price=Math.round(c.budget*rule("tarif").m*OFFERS[S.offer].price*(.75+.5*q)/5)*5;
  const bar=S.bar.open&&S.bar.stock>0?15:0;if(bar)S.bar.stock=Math.max(0,S.bar.stock-4);

/* ================= SIMULATION ================= */
function clean(hrs,open){
  const n=S.teams.menage;let cap=n*(open?5:16)*hrs;R.cleaning=null;if(!n)return;
  const rs=S.rooms.filter(r=>r.open&&!R.busy[r.id]&&!r.reno&&r.p<99.5).sort((a,b)=>a.p-b.p);
  for(const r of rs){if(cap<=0)break;const d=Math.min(cap,100-r.p);r.p+=d;cap-=d;if(!R.cleaning)R.cleaning=r.id}
}
function onOpen(){
  S.nightNo++;S.night={no:S.nightNo,rev:0,exp:0,served:0,lost:0,staffPaid:0,rep0:S.rep,best:null,worst:null,ev:0};
  S.staff.forEach(s=>s.night=0);
  if(S.lingeOrder){S.linge+=S.lingeOrder;S.lingeOrder=0}
  S.nextEvent=S.t+rand(70,120);
  log("Les néons s’allument. La maison ouvre ses portes.",true);
  if(S.nightNo===1)R.forceClient=S.t+6;
  save();
}
function onClose(){
  R.queue.slice().forEach(c=>leave(c,false));
  S.staff.forEach(s=>{if(s.traits.includes("Mère poule"))S.staff.forEach(o=>{if(o!==s)o.moral=clamp(o.moral+3,0,100)});
    if(s.traits.includes("Diva")&&!S.rooms.some(r=>r.open&&RD(r.id).premium))s.moral=clamp(s.moral-4,0,100);
    if(s.resting){s.resting=false;s.moral=clamp(s.moral+6,0,100);if(s.traits.includes("Solitaire"))s.fatigue=clamp(s.fatigue-15,0,100)}});
  S.nightsDone++;
  const n=S.night;S.history.push({no:n.no,rev:n.rev,exp:n.exp,served:n.served,lost:n.lost});
  R.pendingCards.push(()=>bilanCard(n));
  checkPaliers();
  if(S.nightsDone>=3&&!S.protoEnd){S.protoEnd=true;R.pendingCards.push(endCard)}
  S.night=null;save();
  nextCard();
}
function checkPaliers(){
  if(S.palier===0&&S.nightsDone>=1){S.palier=1;R.pendingCards.push(()=>palierCard(1))}
  if(S.palier===1&&S.rep>=25){S.palier=2;R.pendingCards.push(()=>palierCard(2))}
}
function noon(){
  const cost=S.teams.menage*90;if(cost)spend(cost,`Midi : salaire de l’équipe de ménage, ${euro(cost)}.`);
}
function tick(dm){
  const open=isOpen();
  if(open!==R.wasOpen){R.wasOpen=open;if(open)onOpen();else if(S.night)onClose();if(R.modal)return}
  const h=hod(),d=dayIdx();
  if(S.t>=S.nextNoon){S.nextNoon+=1440;noon()}
  // briefing
  const bh=(rule("horaires").o-1)*60;
  if(!open&&S.briefedDay!==d&&h>=bh&&h<bh+90&&!R.modal){briefingCard();return}
  // day visits
  if(!open&&S.palier>=1){for(const c of CANDS){if(!S.candSeen[c.id]&&(d>c.day||(d===c.day&&h>=c.h*60))&&h<18*60){S.candSeen[c.id]=true;visitCard(c.id);return}}}
  if(S.bar.reno&&S.t>=S.bar.reno){S.bar.reno=0;S.bar.open=true;S.bar.stock=60;log("Le bar est rouvert. Premières bulles !",true)}
  S.rooms.forEach(r=>{if(r.reno&&S.t>=r.reno){r.reno=0;r.open=true;r.p=100;r.etat=100;log(`${RD(r.id).name} : travaux terminés, prête à recevoir.`,true);setCurtain(r.id)}});
  const hrs=dm/60;
  if(open){
    const rate=(1+S.rep/100*3.2)*OFFERS[S.offer].flow*rule("selection").flow*rule("tarif").flow;
    if(R.forceClient&&S.t>=R.forceClient){R.forceClient=0;arrive()}
    else if(Math.random()<rate*hrs)arrive();
  }
  R.queue.slice().forEach(c=>{c.pat-=dm;const p=clamp(c.pat/c.patMax,0,1),bar=c.el.querySelector(".pat");if(bar){bar.firstChild.style.width=(p*100)+"%";bar.classList.toggle("low",p<.3)}if(c.pat<=0)leave(c,true)});
  if(open&&minsToClose()>45)dispatch();
  for(const id in R.busy){const b=R.busy[id];if(b.start===Infinity)continue;const p=clamp((S.t-b.start)/b.dur,0,1);const rd=RD(id);$("#prog-"+id).setAttribute("width",(rd.w-24)*p);if(p>=1)finish(id)}
  clean(hrs,open);
  S.staff.forEach(s=>{
    if(!s.busy)s.fatigue=clamp(s.fatigue-(open&&s.works&&!s.resting?1:4)*hrs,0,100);
    if(s.fatigue>75)s.moral=clamp(s.moral-2*hrs,0,100);else if(s.moral<70)s.moral=clamp(s.moral+.3*hrs,0,100);
  });
  if(open&&!R.alerts.some(a=>a.type==="fight")){const tb=S.staff.some(s=>s.traits.includes("Tête brûlée")&&s.works)?1.5:1;if(R.queue.length>=2&&Math.random()<.05*rule("selection").inc*tb*R.queue.length*hrs){addAlert("fight","fight",231,378,{ttl:40,max:40});log("Ça chauffe sur le quai : deux clients se disputent la file.",true)}}
  syncAlerts(open);updFight();
  if(open&&S.t>=S.nextEvent&&minsToClose()>30){S.nextEvent=S.t+rand(150,230);fireEvent();return}
}

$("#pbody").addEventListener("click",e=>{
  if(e.target.closest("#vback")){R.view=null;document.querySelectorAll(".hit.sel").forEach(h=>h.classList.remove("sel"));render(true);return}

    if(a==="clean"){spend(30,null,rd.cx,rd.y+30);r.p=100;log(`${rd.name} : nettoyage express, ça brille.`);tutoEvent("clean")}
    if(a==="reno"){spend(400,null,rd.cx,rd.y+30);r.open=false;r.reno=S.t+360;log(`${rd.name} : on rafraîchit la déco, 6 h de travaux.`)}
    if(a==="reopen"){spend(900,null,rd.cx,rd.y+30);r.reno=S.t+480;log(`${rd.name} : les ouvriers arrivent pour 8 h de travaux.`,true)}
    if(a==="toggle"){r.closed=!r.closed;setCurtain(r.id);log(`${rd.name} : ${r.closed?"fermée":"rouverte"}.`)}}
  if(a==="bar"){spend(600,null,382,262);S.bar.reno=S.t+240;log("Le bar est en travaux pour 4 h.",true)}
  if(a==="barstock"){const c=Math.ceil((100-S.bar.stock)*3);spend(c,null,382,262);S.bar.stock=100;log("Livraison au bar.")}
  if(v&&v.kind==="staff"){const s=staffBy(v.id);
    if(a==="rest"){s.resting=!s.resting;log(`${s.name} ${s.resting?"prend sa soirée.":"reprend le service."}`)}
    if(a==="bonus"){spend(80);s.moral=clamp(s.moral+20,0,100);s.loyaute=clamp(s.loyaute+3,0,100);log(`${s.name} a reçu une prime. Sourire garanti.`)}}
  if(v&&v.kind==="cand"&&a==="recv"){visitCard(v.id);return}
  render(true);
});

function visitCard(id){
  const d=STAFF_DB[id];let asked=null;

  const draw=()=>{
    const full4=S.staff.length>=4;
    card.className="card";card.innerHTML=`<h2 class="script">Une candidate${d.f?"":", enfin un candidat"}</h2>
    <div style="display:flex;gap:12px;align-items:flex-start"><div class="pt big cand">${portrait(d.look)}</div><div class="grow"><div class="nm">${d.name}<small>${d.age} ans</small></div><p style="margin:4px 0 6px">${d.intro}</p>

    <h3>Une question avant de décider</h3>
    ${asked===null?`<div class="choices">${d.qs.map((q,i)=>`<button data-q="${i}">${q.q}</button>`).join("")}</div>`:`<div class="josee" style="color:var(--cream)"><div><b>${d.name}</b>${d.qs[asked].a}</div></div><p class="sub">Trait révélé : <span class="tag">${d.qs[asked].t}</span> ${TRAIT_FX[d.qs[asked].t]}</p>`}
    <h3>Ta proposition</h3><div class="choices">
      <button data-h="45" ${asked===null||full4?"disabled":""}>Embaucher à 45 %<small>Elle garde 45 % de chaque rendez-vous. Peut refuser.</small></button>
      <button data-h="50" ${asked===null||full4?"disabled":""}>Embaucher à 50 %<small>Le tarif du quartier.</small></button>
      <button data-h="55" ${asked===null||full4?"disabled":""}>Embaucher à 55 %<small>Loyauté en hausse dès le départ.</small></button>
      <button data-h="later">Réfléchir<small>Reste en attente dans l’onglet Personnel</small></button>
      <button data-h="no">Refuser poliment</button></div>
    ${full4?`<p class="sub">La maison ne peut pas accueillir plus de 4 personnes pour l’instant.</p>`:""}`;
    card.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{asked=+b.dataset.q;draw()});
    card.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{
      const v=b.dataset.h;
      if(v==="later"){closeCard();log(`${d.name} attend ta réponse.`);dirty();nextCard();return}
      S.cands=S.cands.filter(x=>x!==id);
      if(v==="no"){closeCard();log(`Tu as refusé ${d.name}.`);dirty();nextCard();return}
      const share=+v/100;
      if(share<.5&&Math.random()<.5){closeCard();log(`${d.name} a refusé tes 45 % : « Le Pink Palace paie mieux. »`,true);dirty();nextCard();return}
      const s=mkStaff(id);s.share=share;s.known=asked!==null?[d.qs[asked].t]:[];if(share>.5)s.loyaute+=15;
      S.staff.push(s);const el=staffEl(s);place(el,homeX(s),SALON_Y,true);
      closeCard();log(`${d.name} rejoint la maison à ${v} %.`,true);save();dirty();nextCard();
    });
  };
  R.modal=true;modal.hidden=false;draw();
}

  {t:()=>"Ta première alerte ! Une chambre salie ne reçoit plus personne sous 15 %. Touche la bulle.",target:".bubble",wait:"alert"},
  {t:()=>"Nettoyage express, ou tu attends que le ménage passe demain. Ici, on nettoie.",target:"#pbody",wait:"clean"},
  {t:()=>"Parfait. Laisse la nuit se dérouler : je repasserai à la fermeture.",next:true,nextL:"Merci Josée"}
];
const tring=$("#tring"),tcard=$("#tcard");
const tutoActive=()=>S&&S.tuto>0&&S.tuto<TUTO.length&&!tcard.hidden;
function tutoShow(){
  const st=TUTO[S.tuto];if(!st){tutoHide();return}
  S.speed=S.tuto===6?S.speed:0;renderSpeed();
  tcard.innerHTML=`<div class="josee"><div class="pt">${portrait(JOSEE)}</div><div><b>Madame Josée</b>${st.t(S.player.prenom)}</div></div><div class="btns"><button class="btn ghost" id="tSkip">Passer le didacticiel</button>${st.next?`<button class="btn" id="tNext">${st.nextL||"Suivant"}</button>`:""}</div>`;
  tcard.hidden=false;
  $("#tSkip").onclick=()=>{S.tuto=99;tutoHide();S.speed=1;renderSpeed()};
  if(st.next)$("#tNext").onclick=()=>tutoAdvance();
  requestAnimationFrame(placeTuto);
}
function placeTuto(){
  const st=TUTO[S.tuto];if(!st)return;const app=$("#app").getBoundingClientRect();
  const tgt=st.target?document.querySelector(st.target):null;
  if(tgt){const r=tgt.getBoundingClientRect();tring.hidden=false;Object.assign(tring.style,{left:(r.left-app.left-4)+"px",top:(r.top-app.top-4)+"px",width:(r.width+8)+"px",height:(r.height+8)+"px"});
    const cx=r.left+r.width/2-app.left;tcard.style.left=cx>app.width/2?"10px":"auto";tcard.style.right=cx>app.width/2?"auto":"10px";}
  else{tring.hidden=true;tcard.style.left="50%";tcard.style.right="auto";tcard.style.transform="translateX(-50%)";return}
  tcard.style.transform="";
}
function tutoHide(){tcard.hidden=true;tring.hidden=true}
function tutoAdvance(){
  S.tuto++;
  if(S.tuto===7){tutoHide();S.speed=1;renderSpeed();return}   // wait for first dirty alert
  if(S.tuto===9){tutoShow();return}
  if(S.tuto>=10){tutoHide();S.speed=1;renderSpeed();return}
  tutoShow();
}
function tutoEvent(ev){
  if(!S||S.tuto<=0||S.tuto>=TUTO.length)return;const st=TUTO[S.tuto];if(tcard.hidden||!st||st.wait!==ev)return;
  if(S.tuto===8){S.tuto=9;tutoShow();return}
  tutoAdvance();
}

/* ================= TITLE & CREATION ================= */
function slotSummary(s){const av=AVATARS.find(a=>a.id===s.player.avatar);const d=Math.floor(s.t/1440);return{av,txt:`${esc(s.player.prenom)}, ${esc(s.player.maison)}`,sub:`Chapitre 1, jour ${d+1}. ${euro(s.money)}. ★ ${Math.floor(s.rep)}. ${new Date(s.played).toLocaleDateString("fr-FR")}`}}
function showTitle(){
  S=null;tutoHide();closeCard();R.queue.forEach(c=>c.el.remove());R.queue=[];R.busy={};R.alerts.forEach(a=>a.el.remove());R.alerts=[];
  const sc=$("#titleScreen");let h=`<div class="title-l"><div class="logo script">La bonne passe</div><div class="tagline">Une maison close à Amsterdam. Presque vide. Et toute à toi.</div><div class="tagline" style="margin-top:14px">Prototype 3</div></div><div class="title-r"><h2>Parties</h2>`;
  for(let i=1;i<=3;i++){const s=readSlot(i);
    if(s){const m=slotSummary(s);h+=`<div class="slot"><div class="pt">${portrait(m.av.look)}</div><div class="grow"><b>${m.txt}</b><div class="st">${m.sub}</div></div><button class="del" data-del="${i}">Supprimer</button><button class="btn" data-load="${i}">Continuer</button></div>`}
    else h+=`<div class="slot"><div class="pt" style="display:grid;place-items:center;color:var(--muted)">${i}</div><div class="grow"><b>Emplacement libre</b><div class="st">Aucune partie</div></div><button class="btn ghost" data-new="${i}">Nouvelle partie</button></div>`;
  }
  h+=`</div>`;sc.innerHTML=h;sc.hidden=false;$("#createScreen").hidden=true;
  sc.querySelectorAll("[data-new]").forEach(b=>b.onclick=()=>showCreate(+b.dataset.new));
  sc.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{const s=readSlot(+b.dataset.load);if(s)startGame(s)});
  sc.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(b.dataset.confirm){delSlot(+b.dataset.del);showTitle()}else{b.dataset.confirm="1";b.textContent="Confirmer ?";b.style.color="var(--neon)"}});
}
function showCreate(slot){
  const sc=$("#createScreen");let av="a1";
  sc.innerHTML=`<div class="create"><div><h2>Qui dirige la maison ?</h2><div class="avs">${AVATARS.map(a=>`<button class="av" data-av="${a.id}" aria-pressed="${a.id===av}">${full(a.look)}<span>${a.label}</span></button>`).join("")}</div></div>
  <div><div class="preview script" id="cPrev">La bonne passe</div>
    <div class="field"><label for="cPre">Ton prénom</label><input id="cPre" maxlength="20" autocomplete="off" placeholder="Obligatoire"></div>
    <div class="field"><label for="cMai">Le nom de ta maison (l’enseigne)</label><input id="cMai" maxlength="22" autocomplete="off" value="La bonne passe"></div>
    <div class="field"><label for="cSoc">Nom de ta société (facultatif)</label><input id="cSoc" maxlength="30" autocomplete="off" placeholder="Pour les courriers de la banque"></div>
    <div class="btns"><button class="btn ghost" id="cBack">Retour</button><button class="btn" id="cGo" disabled>Reprendre la maison</button></div></div></div>`;
  sc.hidden=false;$("#titleScreen").hidden=true;
  const upd=()=>{$("#cGo").disabled=!$("#cPre").value.trim();$("#cPrev").textContent=$("#cMai").value.trim()||"La bonne passe"};
  ["cPre","cMai","cSoc"].forEach(i=>$("#"+i).addEventListener("input",upd));
  sc.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{av=b.dataset.av;sc.querySelectorAll("[data-av]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.av===av))});
  $("#cBack").onclick=showTitle;
  $("#cGo").onclick=()=>{const p={avatar:av,prenom:$("#cPre").value.trim(),maison:$("#cMai").value.trim()||"La bonne passe",societe:$("#cSoc").value.trim()};
    const s=newState(slot,p);s.tuto=1;startGame(s);save()};
}
function startGame(state){
  S=state;$("#titleScreen").hidden=true;$("#createScreen").hidden=true;
  R.queue=[];R.busy={};R.alerts.forEach(a=>a.el.remove());R.alerts=[];R.pendingCards=[];R.wasOpen=isOpen();R.view=null;R.tab="maison";
  S.staff.forEach(s=>{s.busy=false;s.anim=false});
  if(R.wasOpen&&!S.night)S.night={no:S.nightNo,rev:0,exp:0,served:0,lost:0,staffPaid:0,rep0:S.rep,best:null,worst:null,ev:0};
  rebuildActors();setSign();S.rooms.forEach(r=>setCurtain(r.id));renderSpeed();fit();render(true);
  $("#ticker").innerHTML=`<time>${fmt(S.t)}</time><b>${S.log[0]?S.log[0].html:"La maison t’attend."}</b>`;
  if(S.tuto>0&&S.tuto<7)tutoShow();
}

/* ================= LOOP ================= */
let last=performance.now();
function loop(now){
  const dt=Math.min(100,now-last);last=now;
  if(S){
    if(!R.modal&&S.speed>0&&(!tutoActive()||S.tuto===6||S.tuto===9)){
      const busy=Object.keys(R.busy).length>0,open=!!R.wasOpen;
      const rate=(open||busy?1.33:20)*S.speed;let dm=dt/1000*rate;
      while(dm>0&&!R.modal){const step=Math.min(dm,4);S.t+=step;tick(step);dm-=step}
    }
    visuals();hud();
    if(needRender||now-R.lastRender>1000)render();
    if(tutoActive())placeTuto();
  }
  requestAnimationFrame(loop);
}
renderSpeed();showTitle();fit();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
